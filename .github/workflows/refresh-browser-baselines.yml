# Visual baselines are evidence, and evidence must come from the environment that judges it: a baseline
# rendered on a workstation carries that workstation's fonts and wrapping, and the browser lanes then
# fail on pixels no code change produced. This manually dispatched workflow rebuilds immutable assets,
# re-renders the requested screenshots inside the same runner image, service topology and font set the
# verification lanes use, and commits both forms of evidence back to the dispatched branch.
name: Refresh browser baselines

# The dispatch API only registers workflows present on the default branch, so a branch introducing
# this lane could never call it. Pushing a change to this file therefore also runs the refresh, with
# the selection below; the refreshed images are printed base64-encoded at the end of the job log so a
# session without artifact egress can still retrieve, decode, and commit them. Native-control containment,
# its explicit keyboard-focus outline and topbar flex sizing are exercised across all six Chromium projects.
on:
  workflow_dispatch:
    inputs:
      arguments:
        description: >-
          Playwright selection passed through verbatim, for example
          "tests/Browser/administrator.spec.ts:505 --project=mobile-chromium".
        required: false
        default: ''
        type: string
  push:
    paths:
      - '.github/workflows/refresh-browser-baselines.yml'

permissions:
  contents: read

concurrency:
  group: refresh-browser-baselines-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Re-render baseline patch
    if: github.ref_type == 'branch' && github.ref_name != github.event.repository.default_branch
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      database:
        image: mariadb:lts
        env:
          MARIADB_DATABASE: kumwe_browser
          MARIADB_USER: kumwe
          MARIADB_PASSWORD: kumwe_browser
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
        ports:
          - '3306:3306'
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - '6379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_BASE_URL: http://127.0.0.1:8080
      APP_PUBLIC_SITE: default
      APP_TRUSTED_HOSTS: 127.0.0.1,localhost
      EXTENSIONS_ALLOW_UNSIGNED_LOCAL: 'true'
      DB_DRIVER: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: kumwe_browser
      DB_USER: kumwe
      DB_PASSWORD: kumwe_browser
      DB_TABLE_PREFIX: kumwe_
      DB_SSLMODE: disable
      DB_SERVER_VERSION: mariadb-12.3.2
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_DATABASE: 0
      REDIS_NAMESPACE: kumwe.browser.baselines
      KUMWE_SITE_CONTENT_PROFILE: placeholder
      KUMWE_BUSINESS_DEMO: 'false'
      KUMWE_BROWSER_ADMIN_EMAIL: browser-administrator@kumwe.test
      KUMWE_BROWSER_ADMIN_PASSWORD: browser administrator password
      KUMWE_BROWSER_LIMITED_EMAIL: browser-limited@kumwe.test
      KUMWE_BROWSER_LIMITED_PASSWORD: browser limited password
      KUMWE_BROWSER_START_SERVER: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: apcu, ctype, fileinfo, filter, intl, json, mbstring, openssl, pcntl, pdo, pdo_mysql, pdo_pgsql, redis, sodium, zip
          coverage: none
          tools: composer:v2

      - name: Provision admitted native runtime
        uses: ./.github/actions/native-runtime

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Cache Composer package downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: composer-files-${{ hashFiles('composer.lock') }}
          restore-keys: composer-files-
      - name: Install locked application dependencies
        run: |
          composer install --no-interaction --prefer-dist
          npm ci

      - name: Type-check and build immutable browser assets
        run: |
          npm run build
          npm run check

      - name: Migrate and create the browser-test administrator
        shell: bash
        run: |
          set -euo pipefail
          app_secret="$(openssl rand -base64 48 | tr -d '\n')"
          echo "APP_SECRET=$app_secret" >> "$GITHUB_ENV"
          export APP_SECRET="$app_secret"
          password_file="$RUNNER_TEMP/browser-administrator-password"
          install -m 0600 /dev/null "$password_file"
          printf %s "$KUMWE_BROWSER_ADMIN_PASSWORD" > "$password_file"
          php bin/kumwe database:migrate
          php bin/kumwe user:create-admin \
            --email="$KUMWE_BROWSER_ADMIN_EMAIL" \
            --name="Browser Administrator" \
            --password-file="$password_file"
          php tests/Support/prepare-browser-contribution.php

      - name: Cache the Playwright browser download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install the Chromium test runtime
        shell: bash
        run: |
          set -euo pipefail
          # No apt here, deliberately: the ubuntu-24.04 runner image ships Google Chrome and
          # Chromium preinstalled (its published manifest says so), so every shared library the
          # Playwright Chromium build needs is already on the image, and the mirror fetch that once
          # hung this step for forty-four minutes installed nothing that was not already present.
          # What remains is the browser download from the Playwright CDN, cached on the lock file
          # above, bounded and announced per attempt for the cold path.
          for attempt in 1 2 3 4; do
            if timeout 300 npx playwright install chromium; then
              exit 0
            fi
            echo "Chromium runtime install attempt ${attempt} failed or stalled; retrying." >&2
            sleep $(( 15 * attempt ))
          done
          echo 'The Chromium test runtime could not be installed after four bounded attempts.' >&2
          exit 1

      - name: Re-render the selected baselines
        shell: bash
        env:
          REFRESH_ARGUMENTS: ${{ inputs.arguments }}
        run: |
          set -euo pipefail
          # The default selection mirrors the complete Chromium verification matrix: both source-
          # language projects plus the four locale-owned RTL projects. This keeps every baseline
          # affected by a shared stylesheet change in one environment-owned refresh. A manually
          # narrowed mobile selection is primed with the desktop project because the verification
          # lane runs desktop first and its persisted state is part of the mobile rendering context.
          # The selection intentionally word-splits: it carries test locations and --project flags.
          arguments="${REFRESH_ARGUMENTS:-}"
          if [ -z "$arguments" ]; then
            arguments='--project=desktop-chromium --project=mobile-chromium'
            arguments="$arguments --project=desktop-chromium-he --project=desktop-chromium-ar"
            arguments="$arguments --project=mobile-chromium-he --project=mobile-chromium-ar"
          else
            npx playwright test --project=desktop-chromium || true
          fi
          npx playwright test $arguments --update-snapshots

      - name: Print refreshed baselines for retrieval from the log
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' record; do
            image="${record:3}"
            case "$image" in
              tests/Browser/screenshots/*) ;;
              *)
                echo "Unexpected screenshot status path $image." >&2
                exit 1
                ;;
            esac
            if [ -L "$image" ]; then
              echo "Refusing to read linked screenshot $image." >&2
              exit 1
            fi
            if [ ! -f "$image" ]; then
              printf '===== BASELINE-DELETE %s =====\n' "$image"
              continue
            fi
            printf '===== BASELINE-BEGIN %s =====\n' "$image"
            base64 -w 4000 "$image"
            printf '\n===== BASELINE-END %s =====\n' "$image"
          done < <(git status --porcelain=v1 -z --untracked-files=all --no-renames -- \
            tests/Browser/screenshots)

      - name: Build the path-scoped refresh patch
        shell: bash
        run: |
          set -euo pipefail
          git add -- public/assets/build public/assets/site.css tests/Browser/screenshots
          git diff --cached --binary --full-index --no-renames -- \
            public/assets/build public/assets/site.css tests/Browser/screenshots \
            > "$RUNNER_TEMP/browser-refresh.patch"

      - name: Upload the refresh patch
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-refresh-patch-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browser-refresh.patch
          if-no-files-found: error
          retention-days: 1

  commit:
    name: Commit validated baseline patch
    needs: render
    if: github.ref_type == 'branch' && github.ref_name != github.event.repository.default_branch
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact rendered revision without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download only the rendered patch artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.render.outputs.artifact-id }}
          path: ${{ runner.temp }}/browser-refresh
          merge-multiple: true

      - name: Apply and validate the path-scoped patch
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          patch_path="$RUNNER_TEMP/browser-refresh/browser-refresh.patch"
          if [ ! -f "$patch_path" ]; then
            echo 'The downloaded refresh patch is missing.' >&2
            exit 1
          fi
          if [ ! -s "$patch_path" ]; then
            echo 'Every selected baseline already matches this environment; nothing to commit.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$(git status --porcelain=v1 --untracked-files=all)" ]; then
            echo 'The exact-SHA checkout was not clean before patch application.' >&2
            exit 1
          fi
          git apply --index --binary "$patch_path"

          changed=0
          while IFS= read -r -d '' metadata && IFS= read -r -d '' path; do
            changed=$((changed + 1))
            case "$path" in
              public/assets/build/*|public/assets/site.css|tests/Browser/screenshots/*) ;;
              *)
                echo "The refresh patch changes forbidden path $path." >&2
                exit 1
                ;;
            esac
            read -r old_mode new_mode old_object new_object status <<< "${metadata#:}"
            case "$status" in
              A|D|M|T) ;;
              *)
                echo "The refresh patch gives $path unsupported raw status $status." >&2
                exit 1
                ;;
            esac
            for mode in "$old_mode" "$new_mode"; do
              case "$mode" in
                000000|100644) ;;
                *)
                  echo "The refresh patch gives $path forbidden old/new mode $old_mode/$new_mode." >&2
                  exit 1
                  ;;
              esac
            done
          done < <(git diff --cached --raw --no-abbrev --no-renames -z)
          if [ "$changed" -eq 0 ]; then
            echo 'The non-empty refresh patch produced no staged change.' >&2
            exit 1
          fi

          for required in public/assets/build/.vite/manifest.json public/assets/site.css; do
            if [ ! -f "$required" ] || [ -L "$required" ]; then
              echo "Required regular output $required is absent or linked." >&2
              exit 1
            fi
            index_entry="$(git ls-files --stage -- "$required")"
            if [[ "$index_entry" == *$'\n'* ]] || [ "${index_entry%% *}" != '100644' ]; then
              echo "Required output $required is not a regular non-executable index file." >&2
              exit 1
            fi
          done
          git diff --cached --check
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Commit the validated refresh without repository hooks
        if: steps.apply.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Lemuel'
          git config user.email 'lemuel@vdm.to'
          git commit --no-verify -m 'Refresh browser artifacts from the verification environment'

      - name: Compare-and-swap push to the source branch
        if: steps.apply.outputs.changed == 'true'
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" != 'branch' ] || [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]; then
            echo 'Automated refresh pushes are restricted to non-default branches.' >&2
            exit 1
          fi
          if [ "$(git rev-parse HEAD^)" != "$GITHUB_SHA" ]; then
            echo 'The refresh commit is not based on the exact rendered revision.' >&2
            exit 1
          fi
          remote_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${GITHUB_REF_NAME}" --jq .object.sha)"
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo 'The source branch advanced while its baselines were rendering; refusing to overwrite it.' >&2
            exit 1
          fi
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push --porcelain \
            --force-with-lease="refs/heads/${GITHUB_REF_NAME}:${GITHUB_SHA}" \
            origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
