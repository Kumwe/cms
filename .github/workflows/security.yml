name: Kumwe security

on:
  push:
    branches:
      - master
  pull_request:
  merge_group:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.28.0
  SYFT_IMAGE: anchore/syft:v1.33.0
  TRIVY_IMAGE: aquasec/trivy:0.67.2

jobs:
  source-and-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require reproducible dependencies
        run: test -f composer.lock

      - name: Install PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: apcu, ctype, fileinfo, filter, intl, json, mbstring, openssl, pcntl, pdo, pdo_mysql, pdo_pgsql, redis, sodium, zip
          coverage: none
          tools: composer:v2

      - name: Provision admitted native runtime
        uses: ./.github/actions/native-runtime

      - name: Cache Composer package downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: composer-files-${{ hashFiles('composer.lock') }}
          restore-keys: composer-files-
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist

      # P7-C consumes this JUnit artifact as the application-level negative-path inventory for the
      # authenticated Studio preview boundary. Scanners below supplement these authority, replay,
      # single-use-grant and route-only CSP proofs; they do not replace them.
      - name: Qualify authenticated Studio preview boundary
        run: |
          install -d build/security
          vendor/bin/phpunit --colors=always --log-junit build/security/studio-preview-junit.xml \
            tests/Unit/Administrator/Http/Handler/AdministratorStudioPreviewDocumentHandlerTest.php \
            tests/Unit/Administrator/Http/StudioPreviewHttpTransportTest.php \
            tests/Unit/Studio/Application/Preview/StudioPreviewTransportGuardTest.php \
            tests/Unit/Studio/Application/Preview/StudioPreviewProducerPortTest.php \
            tests/Unit/Studio/Application/Preview/StudioPreviewActivityRecorderTest.php \
            tests/Integration/Studio/StudioPreviewPersistenceTest.php \
            tests/Unit/Http/Security/SecurityHeadersTest.php \
            tests/Unit/Http/Middleware/SecurityMiddlewareTest.php

      - name: Validate and audit dependencies
        run: |
          composer validate --strict --no-check-all
          composer audit --locked --abandoned=fail
          composer architecture:policy

      # tools/scan-secrets.sh runs this same scan locally as composer security:secrets, so a contributor
      # can see this result before pushing. Change the pinned image or the arguments in both places.
      # --config is passed explicitly rather than relied on being discovered, so a rename or a move of
      # .gitleaks.toml fails the step instead of silently dropping the project's own token rules.
      - name: Scan repository for secrets
        shell: bash
        run: |
          install -d build/security
          test -f .gitleaks.toml
          set +e
          docker run --rm \
            --volume "$PWD:/repo:ro" \
            --volume "$PWD/build/security:/report" \
            --workdir /repo \
            "$GITLEAKS_IMAGE" \
            detect --source=/repo --no-banner --redact \
            --config=/repo/.gitleaks.toml \
            --report-format json --report-path /report/gitleaks.json
          scan_status=$?
          set -e

          if test -s build/security/gitleaks.json; then
            jq '[.[] | {RuleID, File, StartLine, Fingerprint}]' \
              build/security/gitleaks.json
          fi

          exit "$scan_status"

      - name: Scan filesystem dependencies and configuration
        run: >-
          docker run --rm
          --volume "$PWD:/src:ro"
          "$TRIVY_IMAGE"
          filesystem --exit-code 1 --ignore-unfixed
          --severity HIGH,CRITICAL --scanners vuln,misconfig,secret /src

      # The runner's Composer cache is restored above and keyed on composer.lock, so seeding it
      # into the image build makes every locked dist archive a local read: a GitHub API outage
      # cannot fail a build whose dependencies are already on the runner (V2-REL-002).
      - name: Build production runtime image
        run: >-
          docker buildx build
          --pull
          --file docker/php/Dockerfile
          --target runtime
          --tag kumwe-security:${GITHUB_SHA}
          --build-arg KUMWE_RELEASE=2.0.0-security-scan
          --build-context composer-cache="$HOME/.cache/composer/files"
          --load
          .

      # The capacity contract's per-change budgets include an artifact and image size regression
      # budget; the ceilings live in docs/quality/artifact-budget.json and are enforced where each
      # artifact is built.
      - name: Hold the runtime image to its declared size budget
        shell: bash
        run: |
          set -euo pipefail
          size=$(docker image inspect --format '{{.Size}}' "kumwe-security:${GITHUB_SHA}")
          tools/verify-artifact-budget.sh production_runtime_image "$size"

      - name: Scan production runtime image
        run: >-
          docker run --rm
          --volume /var/run/docker.sock:/var/run/docker.sock
          "$TRIVY_IMAGE"
          image --exit-code 1 --ignore-unfixed
          --severity HIGH,CRITICAL kumwe-security:${GITHUB_SHA}

      - name: Build production web image
        run: >-
          docker buildx build
          --pull
          --file docker/php/Dockerfile
          --target web
          --tag kumwe-web-security:${GITHUB_SHA}
          --build-arg KUMWE_RELEASE=2.0.0-security-scan
          --build-context composer-cache="$HOME/.cache/composer/files"
          --load
          .

      - name: Hold the web image to its declared size budget
        shell: bash
        run: |
          set -euo pipefail
          size=$(docker image inspect --format '{{.Size}}' "kumwe-web-security:${GITHUB_SHA}")
          tools/verify-artifact-budget.sh production_web_image "$size"

      - name: Scan production web image
        run: >-
          docker run --rm
          --volume /var/run/docker.sock:/var/run/docker.sock
          "$TRIVY_IMAGE"
          image --exit-code 1 --ignore-unfixed
          --severity HIGH,CRITICAL kumwe-web-security:${GITHUB_SHA}

      - name: Generate source SBOM
        run: |
          install -d build/security
          docker run --rm --volume "$PWD:/src:ro" "$SYFT_IMAGE" \
            dir:/src -o cyclonedx-json > build/security/kumwe-source.cdx.json

      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-evidence-${{ github.sha }}
          path: build/security
          if-no-files-found: error
          retention-days: 14
