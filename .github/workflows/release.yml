name: Kumwe release

on:
  push:
    tags:
      - 'v2.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing protected v2.x tag to release
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  SYFT_IMAGE: anchore/syft:v1.33.0
  TRIVY_IMAGE: aquasec/trivy:0.67.2

jobs:
  acceptance:
    name: Release deployment gate
    uses: ./.github/workflows/deployment-acceptance.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

  release:
    needs: acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      database:
        image: mariadb:lts
        env:
          MARIADB_DATABASE: kumwe_release
          MARIADB_USER: kumwe
          MARIADB_PASSWORD: kumwe_release
          MARIADB_RANDOM_ROOT_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - '6379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_BASE_URL: https://kumwe.test
      APP_TRUSTED_HOSTS: kumwe.test
      EXTENSIONS_ALLOW_UNSIGNED_LOCAL: 'true'
      DB_HOST: 127.0.0.1
      DB_DRIVER: mariadb
      DB_PORT: '3306'
      DB_NAME: kumwe_release
      DB_USER: kumwe
      DB_PASSWORD: kumwe_release
      DB_TABLE_PREFIX: kumwe_
      DB_SSLMODE: disable
      DB_SERVER_VERSION: mariadb-12.3.2
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      REDIS_DATABASE: 0
      REDIS_NAMESPACE: kumwe.release
      KUMWE_SITE_CONTENT_PROFILE: blank
      KUMWE_BUSINESS_DEMO: 'false'
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Validate release identity
        id: release
        shell: bash
        env:
          REQUESTED_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          release_tag="$REQUESTED_RELEASE_TAG"
          [[ "$release_tag" =~ ^v2\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          git show-ref --tags --verify --quiet "refs/tags/$release_tag"
          test "$(git rev-parse HEAD)" = "$(git rev-list --max-count=1 "$release_tag")"
          test -f composer.lock
          repository="${GITHUB_REPOSITORY,,}"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "version=${release_tag#v}" >> "$GITHUB_OUTPUT"
          echo "app_image=$REGISTRY/$repository/app" >> "$GITHUB_OUTPUT"
          echo "web_image=$REGISTRY/$repository/web" >> "$GITHUB_OUTPUT"
          version="${release_tag#v}"
          image_version="${version//+/-}"
          app_image="$REGISTRY/$repository/app"
          web_image="$REGISTRY/$repository/web"
          app_tags="$(printf '%s\n%s' "$app_image:$image_version" "$app_image:${GITHUB_SHA}")"
          web_tags="$(printf '%s\n%s' "$web_image:$image_version" "$web_image:${GITHUB_SHA}")"
          # One stability test, used twice: it decides the moving image tags below and, further down,
          # whether the GitHub release is published as a prerelease. A tag carrying any suffix -- the
          # alpha, beta and rc channels the continuous lane cuts -- is not stable.
          stable=false
          if [[ "$release_tag" =~ ^v2\.[0-9]+\.[0-9]+$ ]]; then
            stable=true
            minor="${version%.*}"
            app_tags="$(printf '%s\n%s\n%s\n%s' "$app_tags" "$app_image:$minor" "$app_image:2" "$app_image:latest")"
            web_tags="$(printf '%s\n%s\n%s\n%s' "$web_tags" "$web_image:$minor" "$web_image:2" "$web_image:latest")"
          fi
          echo "stable=$stable" >> "$GITHUB_OUTPUT"
          {
            echo 'app_tags<<KUMWE_TAGS'
            echo "$app_tags"
            echo 'KUMWE_TAGS'
            echo 'web_tags<<KUMWE_TAGS'
            echo "$web_tags"
            echo 'KUMWE_TAGS'
          } >> "$GITHUB_OUTPUT"

      - name: Install PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: apcu, ctype, fileinfo, filter, intl, json, mbstring, openssl, pcntl, pdo, pdo_mysql, pdo_pgsql, redis, sodium, zip
          coverage: none
          tools: composer:v2

      - name: Provision admitted native runtime
        uses: ./.github/actions/native-runtime

      - name: Install Node.js for release evidence
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Cache Composer package downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: composer-files-${{ hashFiles('composer.lock') }}
          restore-keys: composer-files-
      - name: Generate ephemeral application secret
        shell: bash
        run: echo "APP_SECRET=$(openssl rand -base64 48 | tr -d '\n')" >> "$GITHUB_ENV"

      # This step used to carry its own shorter list of checks — four of the thirteen the local gate runs —
      # so a release could pass while a gate a contributor runs on every change had never been executed
      # against the tag. It now executes the release lane of docs/quality/contract.json, which is the same
      # definition composer qa and this repository's other workflows are held to.
      - name: Cache Composer package downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: composer-files-${{ hashFiles('composer.lock') }}
          restore-keys: composer-files-
      - name: Verify source and locked dependencies
        run: |
          composer validate --strict --no-check-all
          composer install --no-interaction --prefer-dist --dry-run
          composer install --no-interaction --prefer-dist
          composer audit --locked --abandoned=fail
          php bin/kumwe database:migrate
          php tools/quality-contract.php --run --cadence=release

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and publish application image
        id: app
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/php/Dockerfile
          target: runtime
          pull: true
          push: true
          tags: ${{ steps.release.outputs.app_tags }}
          build-args: KUMWE_RELEASE=${{ steps.release.outputs.version }}

      - name: Build and publish web image
        id: web
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/php/Dockerfile
          target: web
          pull: true
          push: true
          tags: ${{ steps.release.outputs.web_tags }}
          build-args: KUMWE_RELEASE=${{ steps.release.outputs.version }}

      - name: Cache Composer package downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: composer-files-${{ hashFiles('composer.lock') }}
          restore-keys: composer-files-
      - name: Build release archive
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.release.outputs.version }}'
          install -d dist/archive dist/package
          composer archive --format=tar --dir=dist/archive --file=kumwe-source
          tar --extract --file=dist/archive/kumwe-source.tar --directory=dist/package
          COMPOSER_ROOT_VERSION="$version" composer install \
            --working-dir=dist/package \
            --classmap-authoritative \
            --no-ansi \
            --no-dev \
            --no-interaction \
            --no-progress \
            --no-scripts \
            --prefer-dist
          find dist/package/storage -mindepth 1 -type f ! -name .gitkeep -delete
          if find dist/package -type l -print -quit | grep -q .; then
              echo 'Release package contains a symbolic link.' >&2
              exit 1
          fi
          if [ -e dist/package/.github ] \
              || [ -e dist/package/tests ] \
              || [ -e dist/package/docker ] \
              || [ -e dist/package/compose.yaml ]; then
              echo 'Release package contains development-only files.' >&2
              exit 1
          fi
          (
              cd dist/package
              zip -X --quiet --recurse-paths "../kumwe-app-${version}.zip" .
          )
          # The capacity contract's per-change budgets include an artifact size regression budget; the
          # ceiling lives in docs/quality/artifact-budget.json and is enforced where the archive is built.
          tools/verify-artifact-budget.sh release_archive "$(stat -c %s "dist/kumwe-app-${version}.zip")"

      - name: Generate SBOMs and scan published images
        env:
          KUMWE_APPLICATION_IMAGE: ${{ steps.release.outputs.app_image }}
          KUMWE_APPLICATION_IMAGE_DIGEST: ${{ steps.app.outputs.digest }}
          KUMWE_RELEASE_COMMIT: ${{ github.sha }}
          KUMWE_RELEASE_VERSION: ${{ steps.release.outputs.version }}
          KUMWE_WEB_IMAGE: ${{ steps.release.outputs.web_image }}
          KUMWE_WEB_IMAGE_DIGEST: ${{ steps.web.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          app_ref='${{ steps.release.outputs.app_image }}@${{ steps.app.outputs.digest }}'
          web_ref='${{ steps.release.outputs.web_image }}@${{ steps.web.outputs.digest }}'
          docker pull "$app_ref"
          docker pull "$web_ref"
          docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock "$SYFT_IMAGE" \
            "$app_ref" -o cyclonedx-json > dist/kumwe-app.cdx.json
          docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock "$SYFT_IMAGE" \
            "$web_ref" -o cyclonedx-json > dist/kumwe-web.cdx.json
          docker run --rm --volume "$PWD/dist/package:/src:ro" "$SYFT_IMAGE" \
            dir:/src -o cyclonedx-json > dist/kumwe-archive.cdx.json
          docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL "$app_ref"
          docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL "$web_ref"
          rm -rf dist/package
          rm -rf dist/archive
          node tools/create-release-manifest.mjs
          (
              cd dist
              sha256sum kumwe-*.cdx.json kumwe-app-*.zip kumwe-release-manifest.json > SHA256SUMS
          )

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign images, SBOM attestations and checksums
        shell: bash
        run: |
          set -euo pipefail
          app_ref='${{ steps.release.outputs.app_image }}@${{ steps.app.outputs.digest }}'
          web_ref='${{ steps.release.outputs.web_image }}@${{ steps.web.outputs.digest }}'
          cosign sign --yes "$app_ref" "$web_ref"
          cosign attest --yes --type cyclonedx --predicate dist/kumwe-app.cdx.json "$app_ref"
          cosign attest --yes --type cyclonedx --predicate dist/kumwe-web.cdx.json "$web_ref"
          cosign sign-blob --yes --bundle dist/SHA256SUMS.cosign.bundle dist/SHA256SUMS

      - name: Attest application image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.release.outputs.app_image }}
          subject-digest: ${{ steps.app.outputs.digest }}
          push-to-registry: true

      - name: Attest web image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.release.outputs.web_image }}
          subject-digest: ${{ steps.web.outputs.digest }}
          push-to-registry: true

      - name: Attest release archive provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/kumwe-app-${{ steps.release.outputs.version }}.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_STABLE: ${{ steps.release.outputs.stable }}
        shell: bash
        run: |
          set -euo pipefail
          # GitHub never infers prerelease status from the tag. The API defaults prerelease to false and
          # marks whatever was published most recently as Latest, so an alpha cut by the continuous lane
          # would sit on the repository front page as the release to download. Both flags are stated
          # explicitly, in both directions, so the answer never depends on publication order.
          if [[ "$RELEASE_STABLE" == 'true' ]]; then
            channel=(--latest)
          else
            channel=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" \
            dist/SHA256SUMS \
            dist/SHA256SUMS.cosign.bundle \
            dist/kumwe-app.cdx.json \
            dist/kumwe-archive.cdx.json \
            "dist/kumwe-app-${RELEASE_VERSION}.zip" \
            dist/kumwe-release-manifest.json \
            dist/kumwe-web.cdx.json \
            --generate-notes \
            --title "Kumwe App ${RELEASE_VERSION}" \
            --verify-tag \
            "${channel[@]}"
