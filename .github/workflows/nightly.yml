name: Kumwe nightly

# The nightly lane exists so that checks which do not fit a merge budget still run on a known cadence, and
# so that "nightly" is a thing this repository executes rather than a thing its documentation mentions. It
# does not restate what to run: the first job executes the nightly lane of docs/quality/contract.json, and a
# check joins that lane by declaring the cadence there and nowhere else.

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/nightly.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - 'tests/Browser/**'
      - 'tests/Support/BrowserProjectManifest.php'
      - 'tests/Support/prepare-browser-contribution.php'
      - 'tools/summarize-browser-attempts.mjs'
      - 'tools/verify-browser-attempt-summary.mjs'

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-contract:
    name: Nightly quality contract
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    services:
      database:
        image: mariadb:lts
        env:
          MARIADB_DATABASE: kumwe_nightly
          MARIADB_USER: kumwe
          MARIADB_PASSWORD: kumwe_nightly
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
        ports:
          - '3306:3306'
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - '6379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_BASE_URL: https://kumwe.test
      APP_TRUSTED_HOSTS: kumwe.test
      EXTENSIONS_ALLOW_UNSIGNED_LOCAL: 'true'
      DB_DRIVER: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: kumwe_nightly
      DB_USER: kumwe
      DB_PASSWORD: kumwe_nightly
      DB_TABLE_PREFIX: kumwe_
      DB_SSLMODE: disable
      DB_SERVER_VERSION: mariadb-12.3.2
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      REDIS_DATABASE: 0
      REDIS_NAMESPACE: kumwe.nightly.quality
      KUMWE_SITE_CONTENT_PROFILE: blank
      KUMWE_BUSINESS_DEMO: 'false'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: apcu, ctype, fileinfo, filter, intl, json, mbstring, openssl, pcntl, pdo, pdo_mysql, pdo_pgsql, redis, sodium, zip
          coverage: none
          tools: composer:v2

      - name: Provision admitted native runtime
        uses: ./.github/actions/native-runtime

      - name: Cache Composer package downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: composer-files-${{ hashFiles('composer.lock') }}
          restore-keys: composer-files-
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Generate ephemeral application secret
        shell: bash
        run: echo "APP_SECRET=$(openssl rand -base64 48 | tr -d '\n')" >> "$GITHUB_ENV"

      - name: Verify the contract before executing it
        run: composer quality:contract

      # Manifest-owned checks execute here. Checks with an explicit nightly workflow binding are delegated
      # to that provisioned job and reported as such, so browser work is not duplicated in this PHP process.
      - name: Execute the nightly lane
        env:
          KUMWE_ARTIFACT_MEMORY: 256M
        run: php tools/quality-contract.php --run --cadence=nightly

  browser:
    name: Nightly browser breadth / ${{ matrix.database.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        database:
          - name: MariaDB LTS
            driver: mariadb
            image: mariadb:lts
            port: 3306
            server-version: mariadb-12.3.2
            health: >-
              --health-cmd "healthcheck.sh --connect --innodb_initialized"
              --health-interval 5s --health-timeout 5s --health-retries 20
    services:
      database:
        image: ${{ matrix.database.image }}
        env:
          MARIADB_DATABASE: kumwe_browser
          MARIADB_USER: kumwe
          MARIADB_PASSWORD: kumwe_browser
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
        ports:
          - '${{ matrix.database.port }}:${{ matrix.database.port }}'
        options: ${{ matrix.database.health }}
      redis:
        image: redis:8-alpine
        ports:
          - '6379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_BASE_URL: http://127.0.0.1:8080
      APP_PUBLIC_SITE: default
      APP_TRUSTED_HOSTS: 127.0.0.1,localhost
      EXTENSIONS_ALLOW_UNSIGNED_LOCAL: 'true'
      DB_DRIVER: ${{ matrix.database.driver }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.database.port }}
      DB_NAME: kumwe_browser
      DB_USER: kumwe
      DB_PASSWORD: kumwe_browser
      DB_TABLE_PREFIX: kumwe_
      DB_SSLMODE: disable
      DB_SERVER_VERSION: ${{ matrix.database.server-version }}
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_DATABASE: 0
      REDIS_NAMESPACE: kumwe.nightly
      KUMWE_SITE_CONTENT_PROFILE: placeholder
      KUMWE_BUSINESS_DEMO: 'false'
      KUMWE_BROWSER_ADMIN_EMAIL: browser-administrator@kumwe.test
      KUMWE_BROWSER_ADMIN_PASSWORD: browser administrator password
      KUMWE_BROWSER_LIMITED_EMAIL: browser-limited@kumwe.test
      KUMWE_BROWSER_LIMITED_PASSWORD: browser limited password
      KUMWE_BROWSER_START_SERVER: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: apcu, ctype, fileinfo, filter, intl, json, mbstring, openssl, pcntl, pdo, pdo_mysql, pdo_pgsql, redis, sodium, zip
          coverage: none
          tools: composer:v2

      - name: Provision admitted native runtime
        uses: ./.github/actions/native-runtime

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Cache Composer package downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: composer-files-${{ hashFiles('composer.lock') }}
          restore-keys: composer-files-
      - name: Install locked application dependencies
        run: |
          composer install --no-interaction --prefer-dist
          npm ci

      - name: Type-check and build immutable browser assets
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npm run build
          generated_status="$(git status --porcelain=v1 --untracked-files=all -- public/assets/build public/assets/site.css)"
          if [ -n "$generated_status" ]; then
            echo 'The committed browser build or site fallback is stale:' >&2
            printf '%s\n' "$generated_status" >&2
            exit 1
          fi

      - name: Migrate and create the browser-test administrator
        shell: bash
        run: |
          set -euo pipefail
          app_secret="$(openssl rand -base64 48 | tr -d '\n')"
          echo "APP_SECRET=$app_secret" >> "$GITHUB_ENV"
          export APP_SECRET="$app_secret"
          password_file="$RUNNER_TEMP/browser-administrator-password"
          install -m 0600 /dev/null "$password_file"
          printf %s "$KUMWE_BROWSER_ADMIN_PASSWORD" > "$password_file"
          php bin/kumwe database:migrate
          php bin/kumwe user:create-admin \
            --email="$KUMWE_BROWSER_ADMIN_EMAIL" \
            --name="Browser Administrator" \
            --password-file="$password_file"
          php tests/Support/prepare-browser-contribution.php

      - name: Cache the Playwright browser download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # `playwright install --with-deps firefox webkit` is one unbounded command doing two very
      # different things, and when the apt half stalls it takes the whole nightly budget with it: this
      # step was killed mid-fetch after sixty minutes with the browsers never installed. The two halves
      # are separated here so each can be bounded and announced on its own.
      #
      # Unlike Chromium, whose libraries the runner image provably ships, WebKit genuinely needs system
      # packages the image does not carry, so the dependency install stays -- it is the stall that is
      # removed, not the dependencies.
      - name: Install the Firefox and WebKit system dependencies
        shell: bash
        run: |
          set -euo pipefail
          # The runner's mirror list has stalled mid-fetch while the canonical archive answered
          # instantly, so point apt at the canonical archive first, exactly as the database client does.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              /etc/apt/apt-mirrors.txt
          fi
          for attempt in 1 2 3; do
            if timeout 240 npx playwright install-deps firefox webkit; then
              exit 0
            fi
            echo "Browser dependency install attempt ${attempt} failed or stalled; retrying." >&2
            sleep $(( 10 * attempt ))
          done
          echo 'The Firefox and WebKit system dependencies could not be installed in three bounded attempts.' >&2
          exit 1

      - name: Install the Firefox and WebKit test runtimes
        shell: bash
        run: |
          set -euo pipefail
          # The browser download itself, cached on the lock file above; bounded and announced for the
          # cold path so a slow CDN fails a step rather than the nightly run.
          for attempt in 1 2 3 4; do
            if timeout 300 npx playwright install firefox webkit; then
              exit 0
            fi
            echo "Firefox and WebKit runtime install attempt ${attempt} failed or stalled; retrying." >&2
            sleep $(( 15 * attempt ))
          done
          echo 'The Firefox and WebKit test runtimes could not be installed after four bounded attempts.' >&2
          exit 1

      # All four breadth projects declare ignoreSnapshots, and that is deliberate rather than a weakening:
      # pixel baselines belong to the browser that recorded them, and comparing a Firefox or WebKit render
      # against a Chromium baseline produces a failure about font hinting rather than about the product.
      # Desktop carries the complete journey set; the bounded mobile cells prove the responsive touch,
      # keyboard, focus, forced-colour, zoom and reflow contract without doubling the nightly job budget.
      - name: Exercise desktop and mobile breadth on Firefox and WebKit
        run: npm run test:browser:breadth

      - name: Summarize first-attempt and retried results
        if: always()
        env:
          KUMWE_BROWSER_ENGINE: ${{ matrix.database.driver }}
        run: >-
          node tools/summarize-browser-attempts.mjs
          --critical=tests/Browser/nightly-critical-journeys.json

      - name: Enforce the nightly browser acceptance figures
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          report='test-results/browser-attempts.json'
          if [ ! -f "$report" ]; then
            echo 'The browser attempt report is missing, so the nightly acceptance cannot be assessed.' >&2
            exit 1
          fi
          if ! jq -e '
            .total > 0
            and ((.projects | sort) == [
              "desktop-firefox",
              "desktop-webkit",
              "mobile-firefox",
              "mobile-webkit"
            ])
            and .firstAttemptPassRatePercent >= 99
            and (.failed | length) == 0
            and .critical.totalExpected > 0
            and (.critical.missing | length) == 0
            and (.critical.failed | length) == 0
            and (.critical.passedOnlyAfterRetry | length) == 0
          ' "$report" >/dev/null; then
            echo 'Nightly browser acceptance failed: require all four declared projects, >=99% first-attempt' >&2
            echo 'overall, no final failure, and every manifest-owned critical journey present and green' >&2
            echo 'on its first attempt.' >&2
            cat "$report" >&2
            exit 1
          fi

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-browser-evidence-${{ matrix.database.driver }}
          path: test-results
          if-no-files-found: warn
          retention-days: 14
