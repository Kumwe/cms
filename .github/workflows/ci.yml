name: Kumwe CI

# The merge_group trigger runs this workflow against the rebased merge candidate when the
# repository's merge queue is enabled: because the merge-lane conditionals key on the event NOT
# being pull_request, a queued candidate runs the complete evidence set — including the checks a
# rebase can newly break, like changelog citation reachability — before master ever moves.
on:
  push:
    branches:
      - master
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gates most likely to reject a push are the record gates: an un-re-recorded baseline, a missing
  # documentation block, a stale contract copy, a changelog citation. They cost seconds; the jobs behind
  # them cost runner-hours. This job runs every record gate first, so a push that would fail on a record
  # is refused in minutes before the database, browser, artifact and deployment jobs spend anything.
  # The quality job remains the substantive verdict and still runs every one of these gates itself.
  preflight:
    name: Pre-flight record gates
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: apcu, ctype, fileinfo, filter, intl, json, mbstring, openssl, pcntl, pdo, pdo_mysql, pdo_pgsql, redis, sodium, zip
          coverage: none
          tools: composer:v2

      - name: Provision admitted native runtime
        uses: ./.github/actions/native-runtime

      - name: Cache Composer package downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: composer-files-${{ hashFiles('composer.lock') }}
          restore-keys: composer-files-

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Verify recorded baselines and frozen contracts
        run: |
          composer baseline:check
          composer quality:contract
          composer extension:contract
          composer extension:independence
          composer conversion:api
          composer cli:contract
          composer mcp:contract
          composer studio:corpus
          composer studio:dependencies
          composer kumwe:capability-index-check
          composer kumwe:core-growth-check

      - name: Verify documentation records
        run: |
          composer docs:api
          composer docs:format:check
          composer docs:tests

      - name: Verify roadmap, interface programme and OpenAPI records
        run: |
          composer interface:programme
          composer roadmap:check
          composer openapi:check

      - name: Verify translation records and coverage attribution
        run: |
          composer translation:check
          composer translation:strings
          composer assets:direction
          composer coverage:attribution

      - name: Verify coding standard and architecture policy
        run: |
          composer cs
          composer architecture:policy

  lockfile:
    name: Composer lock consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install PHP and Composer
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: apcu, ctype, fileinfo, filter, intl, json, mbstring, openssl, pcntl, pdo, pdo_mysql, pdo_pgsql, redis, sodium, zip
          coverage: none
          tools: composer:v2
      - name: Provision admitted native runtime
        uses: ./.github/actions/native-runtime

      - name: Validate committed Composer metadata
        run: composer validate --strict --no-check-all
      - name: Verify the locked dependency graph
        run: composer install --no-interaction --prefer-dist --dry-run
      - name: Require immutable dependency metadata
        run: git diff --exit-code -- composer.json composer.lock

  frontend:
    name: Administrator frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install and audit locked frontend dependencies
        run: |
          npm ci
          npm audit --audit-level=high

      - name: Type-check and build immutable browser assets
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npm run build
          generated_status="$(git status --porcelain=v1 --untracked-files=all -- public/assets/build public/assets/site.css)"
          if [ -n "$generated_status" ]; then
            echo 'The committed browser build or site fallback is stale:' >&2
            printf '%s\n' "$generated_status" >&2
            exit 1
          fi

  browser:
    name: Browser / ${{ matrix.database.name }}
    needs:
      - frontend
      - preflight
    runs-on: ubuntu-24.04
    # The complete desktop/mobile evidence matrix includes native no-JavaScript mutation lifecycles.
    timeout-minutes: 45
    # The journeys used to run against one PostgreSQL service while MariaDB and MySQL are the primary
    # engines, so the surfaces an operator actually uses were only ever driven on the engine fewest
    # installations run. The matrix below is the same journeys on all three, which is what
    # docs/quality/contract.json declares and what composer quality:contract holds it to.
    strategy:
      fail-fast: false
      matrix:
        database:
          - name: MariaDB LTS
            driver: mariadb
            image: mariadb:lts
            port: 3306
            server-version: mariadb-12.3.2
            health: >-
              --health-cmd "healthcheck.sh --connect --innodb_initialized"
              --health-interval 5s --health-timeout 5s --health-retries 20
          - name: MySQL 8.4 LTS
            driver: mysql
            image: mysql:8.4
            port: 3306
            server-version: '8.4'
            health: >-
              --health-cmd "mysqladmin ping -h 127.0.0.1 -ukumwe -pkumwe_browser"
              --health-interval 5s --health-timeout 5s --health-retries 20
          - name: PostgreSQL 17
            driver: pgsql
            image: postgres:17-alpine
            port: 5432
            server-version: '17'
            health: >-
              --health-cmd "pg_isready -U kumwe -d kumwe_browser"
              --health-interval 5s --health-timeout 5s --health-retries 20
    services:
      database:
        image: ${{ matrix.database.image }}
        env:
          MARIADB_DATABASE: kumwe_browser
          MARIADB_USER: kumwe
          MARIADB_PASSWORD: kumwe_browser
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MYSQL_DATABASE: kumwe_browser
          MYSQL_USER: kumwe
          MYSQL_PASSWORD: kumwe_browser
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          POSTGRES_DB: kumwe_browser
          POSTGRES_USER: kumwe
          POSTGRES_PASSWORD: kumwe_browser
        ports:
          - '${{ matrix.database.port }}:${{ matrix.database.port }}'
        options: ${{ matrix.database.health }}
      redis:
        image: redis:8-alpine
        ports:
          - '6379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_BASE_URL: http://127.0.0.1:8080
      APP_PUBLIC_SITE: default
      APP_TRUSTED_HOSTS: 127.0.0.1,localhost
      EXTENSIONS_ALLOW_UNSIGNED_LOCAL: 'true'
      DB_DRIVER: ${{ matrix.database.driver }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.database.port }}
      DB_NAME: kumwe_browser
      DB_USER: kumwe
      DB_PASSWORD: kumwe_browser
      DB_TABLE_PREFIX: kumwe_
      DB_SSLMODE: disable
      DB_SERVER_VERSION: ${{ matrix.database.server-version }}
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_DATABASE: 0
      REDIS_NAMESPACE: kumwe.browser.${{ matrix.database.driver }}
      # Browser snapshots exercise the suite's purpose-built content and business fixtures. The shipped
      # documentation and VDM profiles have their own database-portable smoke coverage below.
      KUMWE_SITE_CONTENT_PROFILE: placeholder
      KUMWE_BUSINESS_DEMO: 'false'
      KUMWE_BROWSER_ADMIN_EMAIL: browser-administrator@kumwe.test
      KUMWE_BROWSER_ADMIN_PASSWORD: browser administrator password
      KUMWE_BROWSER_LIMITED_EMAIL: browser-limited@kumwe.test
      KUMWE_BROWSER_LIMITED_PASSWORD: browser limited password
      KUMWE_BROWSER_START_SERVER: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: apcu, ctype, fileinfo, filter, intl, json, mbstring, openssl, pcntl, pdo, pdo_mysql, pdo_pgsql, redis, sodium, zip
          coverage: none
          tools: composer:v2

      - name: Provision admitted native runtime
        uses: ./.github/actions/native-runtime

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Cache Composer package downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: composer-files-${{ hashFiles('composer.lock') }}
          restore-keys: composer-files-
      - name: Install locked application dependencies
        run: |
          composer install --no-interaction --prefer-dist
          npm ci

      - name: Migrate and create the browser-test administrator
        shell: bash
        run: |
          set -euo pipefail
          app_secret="$(openssl rand -base64 48 | tr -d '\n')"
          echo "APP_SECRET=$app_secret" >> "$GITHUB_ENV"
          export APP_SECRET="$app_secret"
          password_file="$RUNNER_TEMP/browser-administrator-password"
          install -m 0600 /dev/null "$password_file"
          printf %s "$KUMWE_BROWSER_ADMIN_PASSWORD" > "$password_file"
          php bin/kumwe database:migrate
          php bin/kumwe user:create-admin \
            --email="$KUMWE_BROWSER_ADMIN_EMAIL" \
            --name="Browser Administrator" \
            --password-file="$password_file"
          php tests/Support/prepare-browser-contribution.php

      - name: Cache the Playwright browser download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install the Chromium test runtime
        shell: bash
        run: |
          set -euo pipefail
          # No apt here, deliberately: the ubuntu-24.04 runner image ships Google Chrome and
          # Chromium preinstalled (its published manifest says so), so every shared library the
          # Playwright Chromium build needs is already on the image, and the mirror fetch that once
          # hung this step for forty-four minutes installed nothing that was not already present.
          # What remains is the browser download from the Playwright CDN, cached on the lock file
          # above, bounded and announced per attempt for the cold path.
          for attempt in 1 2 3 4; do
            if timeout 300 npx playwright install chromium; then
              exit 0
            fi
            echo "Chromium runtime install attempt ${attempt} failed or stalled; retrying." >&2
            sleep $(( 15 * attempt ))
          done
          echo 'The Chromium test runtime could not be installed after four bounded attempts.' >&2
          exit 1

      - name: Exercise browser, accessibility and visual contracts
        run: npm run test:browser

      # A journey that only passes on its retry is not a passing journey, and reporting the two together
      # hides the difference. The summary separates them and names the commit, engine, browser, viewport
      # and locale each result came from, so the evidence identifies its own run.
      - name: Summarize first-attempt and retried results
        if: always()
        env:
          KUMWE_BROWSER_ENGINE: ${{ matrix.database.driver }}
        run: node tools/summarize-browser-attempts.mjs

      - name: Upload browser and screenshot evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-evidence-${{ matrix.database.driver }}
          path: |
            test-results
            tests/Browser/screenshots
          if-no-files-found: warn
          retention-days: 14

  quality:
    name: PHP 8.5 quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: apcu, ctype, fileinfo, filter, intl, json, mbstring, openssl, pcntl, pdo, pdo_mysql, pdo_pgsql, redis, sodium, zip
          coverage: none
          tools: composer:v2

      - name: Provision admitted native runtime
        uses: ./.github/actions/native-runtime

      - name: Cache Composer package downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: composer-files-${{ hashFiles('composer.lock') }}
          restore-keys: composer-files-
      # PHPStan's own result cache makes an incremental level-max analysis of an unchanged file free.
      # Without persisting it, every run re-analysed the whole tree from cold.
      - name: Cache the PHPStan result cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .phpstan.cache
          key: phpstan-${{ hashFiles('composer.lock') }}-${{ github.sha }}
          restore-keys: |
            phpstan-${{ hashFiles('composer.lock') }}-
            phpstan-

      - name: Install and validate locked dependencies
        run: |
          composer validate --strict --no-check-all
          composer install --no-interaction --prefer-dist
          composer audit --locked --abandoned=fail

      # architecture:policy now runs the semantic dependency graph as well as the textual predicates, so
      # this step fails on an edge that points the wrong way and is not in the recorded baseline.
      - name: Verify source policy and dependency direction
        run: composer architecture:policy

      # The manifest is the definition of every gate and of the lane each one runs in. This step is what
      # binds the definition to this workflow: it fails when a declared check is missing from the job that
      # declares it, and when this workflow runs a gate the manifest does not declare.
      - name: Verify the quality contract
        run: composer quality:contract

      - name: Verify extracted-package contracts and author-package independence
        run: |
          composer extension:contract
          composer extension:independence
          composer conversion:api

      - name: Verify the retained CLI and MCP machine contracts
        run: |
          composer cli:contract
          composer mcp:contract

      - name: Verify the pinned Studio contract corpus and the capability index
        run: |
          composer studio:corpus
          composer studio:dependencies
          composer kumwe:capability-index-check
          composer kumwe:core-growth-check

      - name: Verify the interface programme and the roadmap ledger
        run: |
          composer interface:programme
          composer roadmap:check

      - name: Verify coverage attribution
        run: composer coverage:attribution

      - name: Verify deterministic OpenAPI artifact
        run: composer openapi:check

      - name: Verify deterministic message catalogues and the translation gates
        run: |
          composer translation:check
          composer translation:strings
          composer assets:direction

      - name: Generate coding-standard normalization evidence
        run: |
          composer cs:fix || true
          git diff --binary > phpcbf.patch

      - name: Upload coding-standard normalization evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phpcbf-patch
          path: phpcbf.patch
          if-no-files-found: error
          retention-days: 3

      - name: Require committed coding-standard normalization
        run: |
          composer cs
          git diff --exit-code

      - name: Static analysis
        run: |
          composer analyse || {
            vendor/bin/phpstan analyse --no-progress --memory-limit=1G --error-format=raw
            exit 1
          }

      - name: Unit and architecture tests
        run: |
          vendor/bin/phpunit --testsuite unit --colors=always
          vendor/bin/phpunit --testsuite architecture --colors=always

      # Runs last so that a documentation gap never masks a static-analysis or test failure.
      - name: Verify documentation blocks
        run: |
          php tools/format-docblocks.php src
          git diff --exit-code -- src
          php tools/verify-docblocks.php src

      - name: Verify the reproducible baseline
        run: composer baseline:check

      - name: Verify test-method documentation baseline
        run: composer docs:tests

  database:
    name: PHP 8.5 / ${{ matrix.database.name }}
    needs: preflight
    runs-on: ubuntu-24.04
    # The MariaDB leg alone carries coverage collection, two complete idempotency passes against a
    # reused database and the backup drill on top of the suite. The 3,080-test suite reached its
    # reverse-order pass at minute 29 and GitHub killed it at the former 40-minute ceiling. Keep a
    # bounded budget, with enough margin for all declared evidence on slower hosted runners.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        database:
          # Coverage is collected on MariaDB because MariaDB is the primary engine. Measuring it anywhere
          # else attributes one engine's driver branches and calls the result the product's coverage.
          - name: MariaDB LTS
            driver: mariadb
            image: mariadb:lts
            port: 3306
            server-version: mariadb-12.3.2
            coverage: 'true'
            health: >-
              --health-cmd "healthcheck.sh --connect --innodb_initialized"
              --health-interval 5s --health-timeout 5s --health-retries 20
          - name: MySQL 8.4 LTS
            driver: mysql
            image: mysql:8.4
            port: 3306
            server-version: '8.4'
            health: >-
              --health-cmd "mysqladmin ping -h 127.0.0.1 -ukumwe -pkumwe_test"
              --health-interval 5s --health-timeout 5s --health-retries 20
          - name: PostgreSQL 17
            driver: pgsql
            image: postgres:17-alpine
            port: 5432
            server-version: '17'
            health: >-
              --health-cmd "pg_isready -U kumwe -d kumwe_test"
              --health-interval 5s --health-timeout 5s --health-retries 20
    services:
      database:
        image: ${{ matrix.database.image }}
        env:
          MARIADB_DATABASE: kumwe_test
          MARIADB_USER: kumwe
          MARIADB_PASSWORD: kumwe_test
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MYSQL_DATABASE: kumwe_test
          MYSQL_USER: kumwe
          MYSQL_PASSWORD: kumwe_test
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          POSTGRES_DB: kumwe_test
          POSTGRES_USER: kumwe
          POSTGRES_PASSWORD: kumwe_test
        ports:
          - '${{ matrix.database.port }}:${{ matrix.database.port }}'
        options: ${{ matrix.database.health }}
      redis:
        image: redis:8-alpine
        ports:
          - '6379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_BASE_URL: https://kumwe.test
      APP_TRUSTED_HOSTS: kumwe.test
      EXTENSIONS_ALLOW_UNSIGNED_LOCAL: 'true'
      DB_DRIVER: ${{ matrix.database.driver }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.database.port }}
      DB_NAME: kumwe_test
      DB_USER: kumwe
      DB_PASSWORD: kumwe_test
      DB_TABLE_PREFIX: kumwe_
      DB_SSLMODE: disable
      DB_SERVER_VERSION: ${{ matrix.database.server-version }}
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_DATABASE: 0
      REDIS_NAMESPACE: kumwe.ci
      # PHPUnit forces the same selection. Keeping the pre-test migration aligned prevents the suite from
      # inheriting demo state while the isolated profile smoke passes below retain explicit demo coverage.
      KUMWE_SITE_CONTENT_PROFILE: blank
      KUMWE_BUSINESS_DEMO: 'false'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: apcu, ctype, fileinfo, filter, intl, json, mbstring, openssl, pcntl, pdo, pdo_mysql, pdo_pgsql, redis, sodium, zip
          coverage: ${{ matrix.database.coverage == 'true' && 'pcov' || 'none' }}
          tools: composer:v2

      - name: Provision admitted native runtime
        uses: ./.github/actions/native-runtime

      - name: Generate ephemeral application secret
        shell: bash
        run: echo "APP_SECRET=$(openssl rand -base64 48 | tr -d '\n')" >> "$GITHUB_ENV"

      - name: Cache Composer package downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: composer-files-${{ hashFiles('composer.lock') }}
          restore-keys: composer-files-
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install immutable parent schema
        run: php tests/Support/install-parent-schema.php

      - name: Upgrade parent schema to current
        run: php bin/kumwe database:migrate

      - name: Create isolated demo-profile databases
        shell: bash
        run: |
          set -euo pipefail
          service='${{ job.services.database.id }}'
          if [[ "$DB_DRIVER" == 'pgsql' ]]; then
            docker exec "$service" psql --username=kumwe --dbname=postgres --set=ON_ERROR_STOP=1 \
              --command='CREATE DATABASE kumwe_demo_docs OWNER kumwe'
            docker exec "$service" psql --username=kumwe --dbname=postgres --set=ON_ERROR_STOP=1 \
              --command='CREATE DATABASE kumwe_demo_placeholder OWNER kumwe'
          elif [[ "$DB_DRIVER" == 'mariadb' ]]; then
            docker exec "$service" mariadb --user=root --execute="
              CREATE DATABASE kumwe_demo_docs CHARACTER SET utf8mb4;
              CREATE DATABASE kumwe_demo_placeholder CHARACTER SET utf8mb4;
              GRANT ALL ON kumwe_demo_docs.* TO 'kumwe'@'%';
              GRANT ALL ON kumwe_demo_placeholder.* TO 'kumwe'@'%';
            "
          else
            docker exec "$service" mysql --user=root --execute="
              CREATE DATABASE kumwe_demo_docs CHARACTER SET utf8mb4;
              CREATE DATABASE kumwe_demo_placeholder CHARACTER SET utf8mb4;
              GRANT ALL ON kumwe_demo_docs.* TO 'kumwe'@'%';
              GRANT ALL ON kumwe_demo_placeholder.* TO 'kumwe'@'%';
            "
          fi

      - name: Smoke-test documentation and VDM profiles
        env:
          DB_NAME: kumwe_demo_docs
          DB_TABLE_PREFIX: kumwe_
          REDIS_NAMESPACE: kumwe.ci.demo-docs
          KUMWE_SITE_CONTENT_PROFILE: documentation
          KUMWE_BUSINESS_DEMO: 'true'
        shell: bash
        run: |
          set -euo pipefail
          php tests/Support/install-parent-schema.php
          php bin/kumwe database:migrate
          php tests/Support/verify-demo-profile.php documentation-vdm
          php tests/Support/customize-demo-profile.php apply
          php bin/kumwe database:migrate
          php tests/Support/verify-demo-profile.php documentation-vdm
          php tests/Support/customize-demo-profile.php verify

      - name: Smoke-test placeholder profile without business examples
        env:
          DB_NAME: kumwe_demo_placeholder
          DB_TABLE_PREFIX: kumwe_
          REDIS_NAMESPACE: kumwe.ci.demo-placeholder
          KUMWE_SITE_CONTENT_PROFILE: placeholder
          KUMWE_BUSINESS_DEMO: 'false'
        shell: bash
        run: |
          set -euo pipefail
          php tests/Support/install-parent-schema.php
          php bin/kumwe database:migrate
          php tests/Support/verify-demo-profile.php placeholder-none
          php bin/kumwe database:migrate
          php tests/Support/verify-demo-profile.php placeholder-none

      - name: Run complete test suite
        if: matrix.database.coverage != 'true'
        run: composer test

      - name: Run complete test suite with coverage
        if: matrix.database.coverage == 'true'
        shell: bash
        run: |
          set -euo pipefail
          install -d build/coverage
          vendor/bin/phpunit --colors=always \
            --coverage-clover build/coverage/clover.xml \
            --coverage-text=build/coverage/summary.txt
          tail -n +1 build/coverage/summary.txt

      # The integration suite has to be idempotent against a database another run already used, because
      # that is what CI, a developer's container and a release rehearsal all do. The complete suite above
      # is the first pass; this gate appends the enforced repeat and reverse-class-order passes, giving all
      # three database engines three consecutive integration runs against the same schema and data.
      #
      # V2-QA-004's six-test record is empty, and the step fails on anything new, an exemption that has
      # become stale, or one past its expiry. The process-scoped fixture lifecycle snapshots the migrated
      # definition catalog and, before each PHPUnit process exits, atomically withholds every run-unique
      # fixture's schema installation and rejects its current definition version. A bounded explicit set of
      # replay fixtures remains live; the next pass sees retained history but not a growing contract set.
      #
      # Reverse order is generated as an explicit reverse list of class files; method declaration order is
      # unchanged, so this measures inter-class residue rather than undocumented ordering inside a class.
      # The repeat and reverse-order passes re-run the whole integration suite twice more. They are
      # merge-lane evidence: every push to master still proves them on all three engines, while a
      # pull-request push keeps the complete single pass above and gets its verdict in half the time.
      - name: Prove three integration passes and reverse class order on one database
        if: github.event_name != 'pull_request'
        run: composer test:idempotency -- --engine=${{ matrix.database.driver }}

      - name: Upload the idempotency evidence
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: idempotency-evidence-${{ matrix.database.driver }}
          path: build/idempotency
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce the coverage ratchets
        if: matrix.database.coverage == 'true'
        run: composer coverage:ratchet -- --base=origin/${{ github.base_ref || 'master' }} --record

      - name: Publish the coverage measurement
        if: matrix.database.coverage == 'true'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### Coverage on the canonical engine'
            echo
            echo 'Measured on MariaDB, the primary engine, over the complete suite. The ratchets that are'
            echo 'armed are in docs/quality/coverage-contract.json, and the step above enforces them.'
            echo
            echo '```'
            sed -n '1,20p' build/coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the coverage report
        if: matrix.database.coverage == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: build/coverage
          if-no-files-found: error
          retention-days: 14

      - name: Verify schema status
        run: php bin/kumwe database:status

      # The backup drill below is merge-lane evidence: every push to master still proves the signed
      # backup, clean restore and complete tamper drill on all three engines, while a pull-request
      # push defers it together with the idempotency passes.
      - name: Install database recovery client
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/database-client
        with:
          driver: ${{ matrix.database.driver }}

      # The signing and verification branches of the backup tooling are conditional on a key being
      # configured, so without one they are dead code in every drill this repository runs. minisign
      # comes from the distribution archive rather than a release download, so the step cannot start
      # failing because an upstream asset moved.
      - name: Install the backup signing tool
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends minisign

      - name: Exercise clean-target backup and restore
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          recovery_root="$RUNNER_TEMP/kumwe-recovery-${DB_DRIVER}"
          backup_root="$recovery_root/backups"
          source_media="$recovery_root/source/media"
          source_private="$recovery_root/source/private"
          source_extensions="$recovery_root/source/extensions"
          source_extension_assets="$recovery_root/source/extension-assets"
          restore_root="$recovery_root/restored"
          runtime_manifest="$recovery_root/business-runtime-source.json"
          password_file="$recovery_root/database-password"
          signing_root="$recovery_root/signing"
          install -d -m 0700 \
            "$backup_root" \
            "$source_media" \
            "$source_private" \
            "$source_extensions" \
            "$source_extension_assets" \
            "$restore_root" \
            "$signing_root"
          install -m 0600 /dev/null "$password_file"
          printf %s "$DB_PASSWORD" > "$password_file"
          printf 'acceptance-media' > "$source_media/probe.txt"
          install -d -m 0700 \
            "$source_private/report-exports" \
            "$source_private/report-exports/objects"
          printf 'acceptance-private-report' > "$source_private/report-exports/objects/probe.csv"
          chmod 0600 "$source_private/report-exports/objects/probe.csv"
          printf 'acceptance-extension' > "$source_extensions/probe.txt"
          printf 'acceptance-extension-asset' > "$source_extension_assets/probe.css"
          # An ephemeral, unencrypted keypair that never leaves the runner: the point is to execute
          # the signing and verification branches, not to model key custody.
          minisign -G -f -W \
            -p "$signing_root/backup-signing.pub" \
            -s "$signing_root/backup-signing.key" >/dev/null
          chmod 0600 "$signing_root/backup-signing.key"
          php tests/Support/business-runtime-backup-acceptance.php seed > "$runtime_manifest"
          test -s "$runtime_manifest"

          if [[ "$DB_DRIVER" == pgsql ]]; then
            PGPASSWORD="$DB_PASSWORD" createdb \
              --host="$DB_HOST" --port="$DB_PORT" --username="$DB_USER" kumwe_restore_test
          else
            if [[ "$DB_DRIVER" == mariadb ]]; then
              docker exec '${{ job.services.database.id }}' mariadb --user=root \
                --execute="CREATE DATABASE kumwe_restore_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; GRANT ALL ON kumwe_restore_test.* TO 'kumwe'@'%'"
            else
              docker exec '${{ job.services.database.id }}' mysql --user=root \
                --execute="CREATE DATABASE kumwe_restore_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; GRANT ALL ON kumwe_restore_test.* TO 'kumwe'@'%'"
            fi
          fi

          export KUMWE_BACKUP_CONSISTENCY=quiesced
          export KUMWE_BACKUP_DIR="$backup_root"
          export KUMWE_DB_DRIVER="$DB_DRIVER"
          export KUMWE_DB_HOST="$DB_HOST"
          export KUMWE_DB_PORT="$DB_PORT"
          export KUMWE_DB_NAME="$DB_NAME"
          export KUMWE_DB_USER="$DB_USER"
          export KUMWE_DB_PASSWORD_FILE="$password_file"
          export KUMWE_DB_TABLE_PREFIX="$DB_TABLE_PREFIX"
          export KUMWE_EXTENSIONS_DIR="$source_extensions"
          export KUMWE_EXTENSION_ASSETS_DIR="$source_extension_assets"
          export KUMWE_MEDIA_DIR="$source_media"
          export KUMWE_PRIVATE_DIR="$source_private"
          export KUMWE_RELEASE=2.0.0
          export KUMWE_BACKUP_SIGNING_SECRET_KEY_FILE="$signing_root/backup-signing.key"
          backup_started="$(date +%s)"
          backup_path="$(bash tools/backup.sh)"
          backup_seconds="$(( $(date +%s) - backup_started ))"
          test -f "$backup_path/checksums.sha256.minisig"

          export KUMWE_BACKUP_SIGNING_PUBLIC_KEY_FILE="$signing_root/backup-signing.pub"
          export KUMWE_EXPECTED_RELEASE=2.0.0
          export KUMWE_RESTORE_DB_DRIVER="$DB_DRIVER"
          export KUMWE_RESTORE_DB_HOST="$DB_HOST"
          export KUMWE_RESTORE_DB_PORT="$DB_PORT"
          export KUMWE_RESTORE_DB_NAME=kumwe_restore_test
          export KUMWE_RESTORE_DB_USER="$DB_USER"
          export KUMWE_RESTORE_DB_PASSWORD_FILE="$password_file"
          export KUMWE_RESTORE_DB_TABLE_PREFIX="$DB_TABLE_PREFIX"
          export KUMWE_RESTORE_EXTENSIONS_DIR="$restore_root/extensions"
          export KUMWE_RESTORE_EXTENSION_ASSETS_DIR="$restore_root/extension-assets"
          export KUMWE_RESTORE_MEDIA_DIR="$restore_root/media"
          export KUMWE_RESTORE_PRIVATE_DIR="$restore_root/private"
          restore_started="$(date +%s)"
          bash tools/restore.sh "$backup_path"
          restore_seconds="$(( $(date +%s) - restore_started ))"
          # The measured recovery time is written into the restored installation's own schema
          # recovery evidence, which is what the destructive-plan gate reads.
          DB_NAME=kumwe_restore_test \
          KUMWE_DRILL_REFERENCE="ci-${DB_DRIVER}-${GITHUB_RUN_ID}" \
          KUMWE_DRILL_BACKUP_MANIFEST_CHECKSUM="$(sha256sum "$backup_path/manifest.json" | cut -d' ' -f1)" \
          KUMWE_DRILL_BACKUP_CREATED_AT="$(jq -r '.created_at' "$backup_path/manifest.json")" \
          KUMWE_DRILL_BACKUP_SECONDS="$backup_seconds" \
          KUMWE_DRILL_RESTORE_SECONDS="$restore_seconds" \
            php tests/Support/business-runtime-backup-acceptance.php verify "$runtime_manifest"
          cmp "$source_media/probe.txt" "$restore_root/media/probe.txt"
          cmp \
            "$source_private/report-exports/objects/probe.csv" \
            "$restore_root/private/report-exports/objects/probe.csv"
          test "$(stat --format='%a' "$restore_root/private/report-exports/objects/probe.csv")" = 600
          test "$(stat --format='%a' "$restore_root/private/report-exports")" = 700
          test "$(stat --format='%a' "$restore_root/private/report-exports/objects")" = 700
          cmp "$source_extensions/probe.txt" "$restore_root/extensions/probe.txt"
          cmp "$source_extension_assets/probe.css" "$restore_root/extension-assets/probe.css"

          # Everything above proves a good backup restores. This proves the bad ones do not: the
          # drill damages copies of the backup that was just taken and requires each one to be
          # refused with the message that names the damage. The restored database is handed over as
          # the occupied target, so the "refuse a non-empty database" branch runs against a real one.
          KUMWE_TAMPER_DRILL_OCCUPIED_DB=kumwe_restore_test \
            bash tests/Support/backup-tamper-drill.sh "$backup_path"

  artifact:
    name: Deployed-artifact regression lane
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Four defects in the last programme were found only in production deployment acceptance, after a full
    # deployment had already been stood up: a per-entry archive memory ceiling, a production autoloader
    # that could not load the drill namespace, stranded record-encryption keys, and a drill leg that had
    # never executed inside the image. Every cheaper job missed all four because every cheaper job runs
    # under the development autoloader, with development dependencies present, in a writable tree. This
    # lane builds the released selection, installs it with --no-dev and an authoritative classmap, seals
    # the tree, and runs each of those four as a regression case inside it. It needs no database and no
    # containers, so it fails in minutes rather than after a deployment is up.
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: apcu, ctype, fileinfo, filter, intl, json, mbstring, openssl, pcntl, pdo, pdo_mysql, pdo_pgsql, redis, sodium, zip
          coverage: none
          tools: composer:v2

      - name: Provision admitted native runtime
        uses: ./.github/actions/native-runtime

      - name: Run the deployed-artifact lane
        run: composer test:artifact

      - name: Upload the lane's report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployed-artifact-report
          path: build/deployed-artifact/report.json
          if-no-files-found: error
          retention-days: 14

  deployment:
    name: Complete deployment acceptance
    # Deployment acceptance runs at merge and again at release; a third execution on every pull-request
    # push cost up to ninety further minutes without adding evidence. Merge and release keep the
    # complete acceptance on all three engines and both distribution formats.
    if: github.event_name != 'pull_request'
    needs:
      - quality
      - database
      - artifact
    uses: ./.github/workflows/deployment-acceptance.yml
