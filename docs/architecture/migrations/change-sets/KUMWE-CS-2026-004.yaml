compatibility: "Drop-in for every value: identifier grammars, refusal messages, fingerprints and the surface and strength vocabularies are the App's; the package additionally refuses malformed UTF-8 identities and an orphan step-up workspace, and the context answers the neutral actor ports."
migration_recovery: "Nine migrations changed only their imports; their pre-move checksums are accepted, so databases migrated before the move start unchanged."
security_impact: "No authority change: provenance, grants, capabilities, sessions and the gateway stay host-owned; a foreign implementation of the principal port authorizes nothing, and extensions see only the seven SPI coordinates through the host adapter."
performance_claim: null
rollback: "Revert the App pull request and restore the eight removed classes from the baseline commit."
known_gaps:
  - "The handoff names a broad App namespace root that still holds App classes; the ledger names the exact symbols."
  - "The handoff lists the governance layers fixture among retained tests; the ledger names PHP tests only, so it is omitted."
completion_claim: false
