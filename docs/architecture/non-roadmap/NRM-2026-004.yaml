schema: "kumwe-non-roadmap-record/v1"
id: "NRM-2026-004"
nrm_ref: "NRM-2026-004"
roadmap_impact: "None"
rationale: "Adopt the independently verified kumwe/secret-envelope release and remove its duplicate App implementation; no roadmap objective is claimed."
repositories:
  - "kumwe/app"
  - "kumwe/secret-envelope"
behavior_before: "App owned envelope values, encryption interfaces, key-ring values and sodium cipher implementations."
behavior_after: "Record encryption uses the package cipher and values; App retains configuration, key derivation, scoped associated data, rotation, audit and mutation-plan purpose separation."
public_api_impact: "Internal App symbols move to the package namespaces listed in the migration ledger; extension-facing contracts and application workflows retain their existing owners."
dependency_impact: "Adds exact runtime dependency kumwe/secret-envelope 0.1.1."
compatibility: "Stored ciphertext, nonce, key_id and algorithm serialization, legacy key derivation and associated-data bytes are preserved. Single-key construction now accepts KeyMaterial; package validation refuses malformed ciphertext shorter than its authentication tag."
data_migration: null
security_impact: "Host custody, legacy-key reads, purpose separation, record authorization and rotation audit remain; package keys refuse unsafe serialization."
performance:
  claim: "None"
  evidence: []
operations_deployment: "Install the committed Composer lock on PHP8.5; existing host configuration and storage remain."
recovery_rollback: "Revert the combined foundation adoption change and install its previous Composer lock; no persisted data migration is required."
