id: NRM-2026-005
nrm_ref: NRM-2026-005
roadmap_impact: None
rationale: "Adopt verified kumwe/access-context 0.1.2, the owner of the access-context values and the neutral actor ports."
repositories:
  - kumwe/app
  - kumwe/access-context
behavior_before: "App declared the site, organization, workspace, membership, surface, strength, step-up and execution-context values itself."
behavior_after: "The eight values come from kumwe/access-context 0.1.2; App identities answer its Principal and SystemActor ports, and the host keeps the request attribute and the SDK adapter."
public_api_impact: "None for callers of the values; principal() answers the neutral port and grant-carrying consumers narrow it through AuthenticatedPrincipal::of()."
dependency_impact: "Adds kumwe/access-context 0.1.2 exactly; no other lock entry changes."
compatibility: "Drop-in for every consumer; raw control bytes in a scope identifier, malformed UTF-8 identities, an invalid principal subject, epoch or system actor token and an orphan step-up workspace are now refused at the value."
data_migration: None
security_impact: "No authority change; provenance, grants, sessions and the gateway stay host-owned, and extensions see only the SPI coordinates through the host adapter."
performance:
  claim: None
  evidence: []
operations_deployment: "None; databases migrated before the move keep their recorded migration checksums."
recovery_rollback: "Revert the adoption pull request and restore the eight removed classes; no persisted data changes."
artifacts_evidence:
