  - docs/architecture/migrations/change-sets/KUMWE-CS-2026-004.yaml
  - docs/architecture/migrations/trains/KUMWE-TRAIN-2026-004.yaml
  - docs/architecture/migrations/evidence/KUMWE-MIG-2026-004/RELEASE-ATTESTATION.yaml
  - docs/architecture/capability-index.md
known_gaps:
